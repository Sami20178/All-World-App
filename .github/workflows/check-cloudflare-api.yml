name: All World Cloudflare API smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify deployed HTTPS API
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test health and public project metadata
        env:
          API_BASE_URL: https://all-world-app.docc-samisoliman.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE_URL;
          const checks = [
            {
              path: "/api/plugin/health",
              validate(data) {
                if (data.ok !== true) throw new Error("health.ok must be true");
                if (data.service !== "All World API") throw new Error("Unexpected service name");
                if (data.status !== "healthy") throw new Error("API is not healthy");
                if (!Array.isArray(data.endpoints) || !data.endpoints.includes("/api/plugin/site-info")) {
                  throw new Error("Expected endpoint list is missing");
                }
              }
            },
            {
              path: "/api/plugin/site-info",
              validate(data) {
                if (data.name !== "All World") throw new Error("Unexpected project name");
                if (data.website !== "https://all-world-app-source-code.docc-samisoliman.workers.dev/") {
                  throw new Error("Website URL does not match canonical site");
                }
                if (!data.source_repository?.includes("Sami20178/All-World-App-Source-Code-")) {
                  throw new Error("Source repository metadata is missing");
                }
                if (!data.node_server_repository?.includes("Sami20178/All-World-App")) {
                  throw new Error("Node server repository metadata is missing");
                }
              }
            }
          ];

          for (const check of checks) {
            const url = base + check.path;
            const response = await fetch(url, {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(15000)
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`${url} returned HTTP ${response.status}: ${body.slice(0, 300)}`);
            }
            let data;
            try { data = JSON.parse(body); }
            catch { throw new Error(`${url} did not return valid JSON`); }
            check.validate(data);
            console.log(`PASS ${url} (HTTP ${response.status})`);
          }
          console.log("All World API smoke tests passed.");
          NODE

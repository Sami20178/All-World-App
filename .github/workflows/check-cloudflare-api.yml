name: All World Cloudflare API smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify deployed HTTPS API and MCP tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test public health and project metadata
        env:
          API_BASE_URL: https://all-world-app.docc-samisoliman.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE_URL;
          const checks = [
            {
              path: "/api/plugin/health",
              validate(data) {
                if (data.ok !== true) throw new Error("health.ok must be true");
                if (data.service !== "All World API") throw new Error("Unexpected service name");
                if (data.status !== "healthy") throw new Error("API is not healthy");
                if (!Array.isArray(data.endpoints) || !data.endpoints.includes("/mcp")) {
                  throw new Error("MCP endpoint is missing from health response");
                }
              }
            },
            {
              path: "/api/plugin/site-info",
              validate(data) {
                if (data.name !== "All World") throw new Error("Unexpected project name");
                if (data.website !== "https://all-world-app-source-code.docc-samisoliman.workers.dev/") {
                  throw new Error("Website URL does not match canonical site");
                }
                if (!data.source_repository?.includes("Sami20178/All-World-App-Source-Code-")) {
                  throw new Error("Source repository metadata is missing");
                }
                if (!data.node_server_repository?.includes("Sami20178/All-World-App")) {
                  throw new Error("Node server repository metadata is missing");
                }
                if (data.mcp_endpoint !== base + "/mcp") throw new Error("MCP endpoint URL is missing or incorrect");
              }
            }
          ];

          for (const check of checks) {
            const url = base + check.path;
            const response = await fetch(url, {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(15000)
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${url} returned HTTP ${response.status}: ${body.slice(0, 300)}`);
            let data;
            try { data = JSON.parse(body); }
            catch { throw new Error(`${url} did not return valid JSON`); }
            check.validate(data);
            console.log(`PASS ${url} (HTTP ${response.status})`);
          }

          async function mcp(method, params = {}, id = 1) {
            const url = base + "/mcp";
            const response = await fetch(url, {
              method: "POST",
              headers: { "content-type": "application/json", accept: "application/json, text/event-stream" },
              body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
              signal: AbortSignal.timeout(15000)
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${url} ${method} returned HTTP ${response.status}: ${body.slice(0, 300)}`);
            let data;
            try { data = JSON.parse(body); }
            catch { throw new Error(`${url} ${method} did not return JSON: ${body.slice(0, 300)}`); }
            if (data.jsonrpc !== "2.0" || data.id !== id || data.error) {
              throw new Error(`${url} ${method} returned invalid JSON-RPC: ${JSON.stringify(data).slice(0, 300)}`);
            }
            return data.result;
          }

          const init = await mcp("initialize", {
            protocolVersion: "2025-03-26",
            capabilities: {},
            clientInfo: { name: "all-world-smoke-test", version: "1.0.0" }
          }, 10);
          if (!init.capabilities?.tools) throw new Error("MCP initialize response lacks tools capability");
          console.log("PASS MCP initialize");

          const listed = await mcp("tools/list", {}, 11);
          const names = (listed.tools || []).map(tool => tool.name);
          for (const required of ["get_api_health", "get_site_info"]) {
            if (!names.includes(required)) throw new Error(`MCP tool missing: ${required}`);
          }
          console.log("PASS MCP tools/list: " + names.join(", "));

          const health = await mcp("tools/call", { name: "get_api_health", arguments: {} }, 12);
          const healthText = health.content?.find(item => item.type === "text")?.text;
          const healthData = JSON.parse(healthText || "{}");
          if (healthData.ok !== true || healthData.status !== "healthy") throw new Error("MCP health tool returned unexpected data");
          console.log("PASS MCP tools/call get_api_health");

          const site = await mcp("tools/call", { name: "get_site_info", arguments: {} }, 13);
          const siteText = site.content?.find(item => item.type === "text")?.text;
          const siteData = JSON.parse(siteText || "{}");
          if (siteData.name !== "All World" || siteData.website !== "https://all-world-app-source-code.docc-samisoliman.workers.dev/") {
            throw new Error("MCP site-info tool returned unexpected data");
          }
          console.log("PASS MCP tools/call get_site_info");
          console.log("All World API and MCP smoke tests passed.");
          NODE

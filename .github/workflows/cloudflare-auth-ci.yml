name: Cloudflare auth Worker validation

on:
  push:
    branches: [main, feature/cloudflare-auth-d1]
    paths:
      - "cloudflare-auth/**"
      - ".github/workflows/cloudflare-auth-ci.yml"
  pull_request:
    paths:
      - "cloudflare-auth/**"
      - ".github/workflows/cloudflare-auth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        run: node --check cloudflare-auth/worker.mjs
      - name: Check auth preview smoke script syntax
        run: node --check cloudflare-auth/preview-target.mjs && node --check cloudflare-auth/tests/preview-smoke.mjs
      - name: Check isolated benchmark Worker and runner syntax
        run: node --check cloudflare-auth/scrypt-benchmark-worker.mjs && node --check cloudflare-auth/tests/scrypt-worker-benchmark.mjs
      - name: Test workflow credential isolation
        run: node --test cloudflare-auth/tests/workflow-secret-isolation.test.mjs
      - name: Test auth preview target isolation
        run: node --test cloudflare-auth/tests/preview-target.test.mjs
      - name: Run auth Worker smoke tests
        run: node --test cloudflare-auth/tests/worker-auth.test.mjs
      - name: Benchmark scrypt candidates (Node.js only)
        run: node --test cloudflare-auth/tests/scrypt-benchmark.test.mjs
      - name: Validate isolated auth preview Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare-auth/wrangler.preview.jsonc

  # A credentialed remote benchmark is only allowed from a manual run on main.
  # Pull-request and ordinary push jobs never receive Cloudflare credentials.
  remote-worker-benchmark:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Require the dedicated Cloudflare benchmark token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for the trusted main-branch benchmark."
            exit 1
          fi
      - name: Benchmark scrypt candidates in isolated Cloudflare Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6ff4ba42c59b9b8a01a0765ac703bef6"
        run: node cloudflare-auth/tests/scrypt-worker-benchmark.mjs

  preview-smoke:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test isolated auth preview end-to-end
        env:
          AUTH_PREVIEW_BASE_URL: https://all-world-auth-api-preview.docc-samisoliman.workers.dev
        run: node cloudflare-auth/tests/preview-smoke.mjs

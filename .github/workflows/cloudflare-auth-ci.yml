name: Cloudflare auth Worker validation

on:
  push:
    branches: [main, feature/cloudflare-auth-d1]
    paths:
      - "cloudflare-auth/**"
      - ".github/workflows/cloudflare-auth-ci.yml"
  pull_request:
    paths:
      - "cloudflare-auth/**"
      - ".github/workflows/cloudflare-auth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        run: node --check cloudflare-auth/worker.mjs
      - name: Check auth preview smoke script syntax
        run: node --check cloudflare-auth/preview-target.mjs && node --check cloudflare-auth/tests/preview-smoke.mjs
      - name: Test auth preview target isolation
        run: node --test cloudflare-auth/tests/preview-target.test.mjs
      - name: Run auth Worker smoke tests
        run: node --test cloudflare-auth/tests/worker-auth.test.mjs
      - name: Benchmark scrypt candidates (Node.js only)
        run: node --test cloudflare-auth/tests/scrypt-benchmark.test.mjs

      - name: Validate isolated auth preview Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare-auth/wrangler.preview.jsonc

  preview-smoke:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test isolated auth preview end-to-end
        env:
          AUTH_PREVIEW_BASE_URL: https://all-world-auth-api-preview.docc-samisoliman.workers.dev
        run: node cloudflare-auth/tests/preview-smoke.mjs
